name: Risk-based Codex review

on:
  pull_request_target:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.classify.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - id: classify
        name: Classify protected review boundary from base-owned code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$WORK/files.json"

          python3 -I - "$WORK/files.json" "$WORK/changed.bin" <<'PY'
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          payload = json.loads(source.read_text(encoding="utf-8"))
          pages = payload if payload and isinstance(payload[0], list) else [payload]
          names = []
          for page in pages:
              for item in page:
                  name = item.get("filename")
                  if not isinstance(name, str):
                      raise SystemExit("review-gate: malformed pull files payload")
                  names.append(name)
          target.write_bytes(b"\0".join(name.encode("utf-8") for name in names) + (b"\0" if names else b""))
          PY

          python3 scripts/review_gate_required.py --nul \
            < "$WORK/changed.bin" \
            > "$WORK/decision.json"
          cat "$WORK/decision.json"

          required=$(python3 -I -c \
            'import json,sys; print(str(json.load(open(sys.argv[1]))["required"]).lower())' \
            "$WORK/decision.json")
          echo "required=$required" >> "$GITHUB_OUTPUT"

  review-gate:
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - name: Low-risk change — no blocking outside review
        if: needs.classify.outputs.required != 'true'
        run: |
          echo 'PASS: protected review boundary not touched.'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.classify.outputs.required == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Wait for exact-head Codex review
        if: needs.classify.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          result=$(./tools/pr/codex-review-wait.sh "$PR_NUMBER" "$EXPECTED_HEAD" 600 10)
          rc=$?
          set -e
          printf '%s\n' "$result"

          if [ "$rc" -ne 0 ]; then
            echo "::error::Codex review did not reach a terminal exact-head state (rc=$rc)."
            exit "$rc"
          fi

          status=$(printf '%s\n' "$result" | python3 -I -c \
            'import json,sys; print(json.load(sys.stdin)["status"])')
          case "$status" in
            CLEAN) echo 'PASS: exact-head Codex review completed clean.' ;;
            FINDINGS)
              echo '::error::Exact-head Codex review has unresolved findings.'
              exit 1
              ;;
            *)
              echo "::error::Unexpected terminal Codex status: $status"
              exit 2
              ;;
          esac
