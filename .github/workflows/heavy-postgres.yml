name: Heavy PostgreSQL contract

on:
  pull_request:
    paths:
      - 'infra/postgres/**'
      - 'qa/postgres/**'
      - 'src/dreaming/proposal-ledger.ts'
      - 'src/dreaming/proposal-ledger-postgres.ts'
      - 'src/dreaming/source-batch-postgres.ts'
      - 'src/dreaming/source-batch-receipt.ts'
      - 'src/dreaming/source-batch-run.ts'
      - 'src/dreaming/source-batch-acquire.ts'
      - 'test/source-batch-acquire.test.mjs'
      - 'test/source-batch-run.test.mjs'
      - 'src/dreaming/source-handoff.ts'
      - 'src/dreaming/verified-session-work.ts'
      - 'src/dreaming/durable-pilot2.ts'
      - 'src/dreaming/checkpoint-pilot2.ts'
      - 'test/proposal-ledger-postgres.test.mjs'
      - 'test/neon-ledger-ddl.test.mjs'
      - 'test/qa-contract.test.mjs'
      - 'tools/ci/heavy-postgres'
      - 'scripts/mutation-shards.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/heavy-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PG_EXPECTED_MAJOR: '18'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npx --yes pnpm@11.3.0 install --frozen-lockfile

      - name: Start runner PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD 'postgres';"
          if ! sudo -u postgres psql -X -Atqc "SELECT 1 FROM pg_database WHERE datname = 'dreaming_worker_contract'" | grep -qx 1; then
            sudo -u postgres createdb dreaming_worker_contract
          fi
          for attempt in $(seq 1 30); do
            if PGPASSWORD=postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres -d dreaming_worker_contract >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          sudo systemctl status postgresql.service --no-pager >&2 || true
          exit 1

      - name: Run repository PostgreSQL contract
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dreaming_worker_contract
        run: tools/ci/heavy-postgres
