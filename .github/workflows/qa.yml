name: QA check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: npx --yes pnpm@11.3.0 install --frozen-lockfile

      - name: Install locked SpecD QA toolchain
        run: ./tools/specd/install

      - name: Checkout pinned JSONTestSuite corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nst/JSONTestSuite
          ref: 1ef36fa01286573e846ac449e8683f8833c5b26a
          path: .qa-json-testsuite
          sparse-checkout: test_parsing
          persist-credentials: false

      - name: Run JSON conformance checks
        run: |
          node tools/dev/json-conformance.mjs .qa-json-testsuite
          rm -rf .qa-json-testsuite

      - name: Run canonical repository QA
        env:
          SPECD_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./tools/dev/check
