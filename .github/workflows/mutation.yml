name: Targeted mutation test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/dreaming/**'
      - 'src/mastra/observability-routing.ts'
      - 'src/mastra/pilot1-tracing.ts'
      - 'test/**'
      - 'scripts/mutation-shards.mjs'
      - 'tools/ci/mutation-test'
      - 'stryker.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'src/dreaming/**'
      - 'src/mastra/observability-routing.ts'
      - 'src/mastra/pilot1-tracing.ts'
      - 'test/**'
      - 'scripts/mutation-shards.mjs'
      - 'tools/ci/mutation-test'
      - 'stryker.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  mutation:
    name: mutation (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [pilot0-1, pilot2, critique, critique-live, observability]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npx --yes pnpm@11.3.0 install --frozen-lockfile

      - name: Run targeted mutation shard
        run: npm run mutation -- ${{ matrix.shard }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mutation-receipt-${{ matrix.shard }}-${{ github.sha }}
          path: reports/mutation/receipt.json
          if-no-files-found: warn
          retention-days: 14
